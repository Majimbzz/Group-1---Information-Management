<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to my Simple Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #ffc3a0, #ffafbd, #c9fffd 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .hero-icon {
            font-size: 5em;
            color: #ff69b4;
            animation: bounce 1.5s infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }
        .hero-title {
            font-size: 2.5em;
            font-weight: 500;
            color: #333;
            margin-top: 12px;
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 32px rgba(0,0,0,0.18);
            border-radius: 25px;
            padding: 32px 20px;
            backdrop-filter: blur(8px);
            text-align: center;
        }
        .nav {
            display: grid;
            grid-template-columns: repeat(2, minmax(100px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }
        .nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            padding: 24px 10px;
            border-radius: 19px;
            font-size: 1.25em;
            background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            transition: transform 0.23s, box-shadow 0.23s, background 0.26s;
            box-shadow: 0 4px 18px rgba(0,0,0,0.13);
            position: relative;
        }
        .nav a .nav-icon {
            font-size: 2.4em;
            margin-bottom: 12px;
            transition: color 0.23s, transform 0.23s;
        }
        .nav a:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            background: linear-gradient(120deg, #f78ca2 0%, #f6d365 100%);
        }
        .nav a:hover .nav-icon {
            color: #ff69b4;
            transform: rotate(-10deg) scale(1.13);
        }
        .footer {
            margin-top: 28px;
            color: #444;
            font-size: 1.05em;
        }
        @media (max-width: 520px) {
            .glass {
                padding: 18px 6px;
            }
            .hero-title {
                font-size: 1.45em;
            }
            .nav {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <span class="hero-icon"><i class="fas fa-robot"></i></span>
        <div class="hero-title">Welcome to my Simple Website!</div>
        <div style="margin-top:9px;color: #7a4d2c;font-size:1.1em">Hello, Student! Ready to start?</div>
    </div>
    <div class="glass">
        <div class="nav">
            <a href="insert.html">
                <span class="nav-icon"><i class="fas fa-plus-circle"></i></span>
                Insert
            </a>
            <a href="search.html">
                <span class="nav-icon"><i class="fas fa-search"></i></span>
                Search
            </a>
            <a href="update.html">
                <span class="nav-icon"><i class="fas fa-pen-fancy"></i></span>
                Update
            </a>
            <a href="delete.html">
                <span class="nav-icon"><i class="fas fa-trash-alt"></i></span>
                Delete
            </a>
        </div>
        <div class="footer">
            Crafted with <span style="color:#ff69b4">&hearts;</span> using HTML &amp; CSS | Connect: <i class="fas fa-envelope"></i> <i class="fab fa-facebook"></i>
        </div>
    </div>
</body>
</html>
